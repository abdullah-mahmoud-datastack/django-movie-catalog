{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{% endblock %}</title>
    {% load bootstrap5 %}
    {% bootstrap_css %}
    {% bootstrap_javascript %}
    {% block head %}{% endblock head %}
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <a class="navbar-brand mx-5" href="{% url 'home' %}">Movies</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
    </nav>

    {% block content %}
    {% endblock %}

    <footer class="bg-body-tertiary text-center">
        <!-- Grid container -->
        <div class="container p-4 pb-0">
            <!-- Section: Social media -->
            <section class="mb-4">
            <!-- Facebook -->
                <a data-mdb-ripple-init class="btn text-white btn-floating m-1"style="background-color: #3b5998;" href="https://www.facebook.com/profile.php?id=100083729833488" role="button">
                    <i class="fab fa-facebook-f">facebook</i>
                </a>
                <!-- Linkedin -->
                <a data-mdb-ripple-init class="btn text-white btn-floating m-1" style="background-color: #0082ca;" href="https://www.linkedin.com/in/abdullah-mahmoud-de1344/"role="button">
                    <i class="fab fa-linkedin-in">Linkedin</i>
                </a>
                <!-- Github -->
                <a data-mdb-ripple-init class="btn text-white btn-floating m-1" style="background-color: #333333;" href="https://github.com/abdullah-mahmoud-datastack" role="button" >
                    <i class="fab fa-github">Github</i>
                </a>
            </section>
            <!-- Section: Social media -->
        </div>
        <!-- Grid container -->

        <!-- Copyright -->
        <div class="text-center p-3" style="background-color: rgba(0, 0, 0, 0.05);">
            © 2026 Copyright:
            <a class="text-body" href="https://github.com/abdullah-mahmoud-datastack">Abdullah Mahmoud (EL-Yamany)</a>
        </div>
        <!-- Copyright -->
        </footer>

</body>
</html>
